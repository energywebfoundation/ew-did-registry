# Copy of energywebfoundation/security-workflow-template/.github/workflows/security-scan.yml.
# This repository is public and cannot call the private shared workflow, so keep this
# file in sync with the template.

name: Security Scan

on:
  pull_request:
  push:
    branches: [development]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

# Explicit bash adds "-o pipefail", so a failing scanner is not hidden by a pipe.
defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  sast:
    name: SAST - Semgrep
    runs-on: ubuntu-26.04
    timeout-minutes: 30

    steps:
      - &checkout
        name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Keep the docker hardening flags identical in both jobs.
      - name: Semgrep SAST
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --cap-drop=ALL \
            --security-opt=no-new-privileges \
            --env HOME=/tmp \
            --mount "type=bind,src=${GITHUB_WORKSPACE},dst=/src,readonly" \
            --workdir /src \
            semgrep/semgrep:1.178.0@sha256:32e459968daabe7ab86968184a29109b9564aa00392401156f9788452b42786b \
            semgrep scan \
              --config p/default \
              --metrics off \
              --error \
              .

  sca:
    name: SCA - Trivy
    runs-on: ubuntu-26.04
    timeout-minutes: 30

    steps:
      - *checkout

      - name: Trivy SCA
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --cap-drop=ALL \
            --security-opt=no-new-privileges \
            --env HOME=/tmp \
            --mount "type=bind,src=${GITHUB_WORKSPACE},dst=/src,readonly" \
            --workdir /src \
            ghcr.io/aquasecurity/trivy:0.75.0@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa \
            fs \
              --no-progress \
              --scanners vuln \
              --pkg-types library \
              --severity HIGH,CRITICAL \
              --exit-code 1 \
              . 2>&1 | tee "${RUNNER_TEMP}/trivy.log"
          if grep -q 'Supported files for scanner(s) not found' "${RUNNER_TEMP}/trivy.log"; then
            echo "::warning title=Trivy found no lockfile::No dependencies were scanned. Commit your lockfile so Trivy can check it."
          fi
